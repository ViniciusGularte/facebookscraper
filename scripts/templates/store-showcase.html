<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrabClientsNow Store Promo</title>
  <style>
    :root {
      --charcoal: #1c1c1c;
      --orange: #f5630a;
      --muted: #717171;
      --muted-2: #9ca3af;
      --divider: #333333;
      --danger: #dc2626;
      --price-old: #555555;
      --white: #ffffff;
      --font-display: "Barlow Condensed", "Liberation Sans Narrow", "Arial Narrow", "DejaVu Sans Condensed", sans-serif;
      --font-body: "Barlow", "DejaVu Sans", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1400px;
      height: 560px;
      overflow: hidden;
      background: var(--charcoal);
    }

    body {
      position: relative;
      font-family: var(--font-body);
      color: var(--white);
    }

    .main {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 72px;
      left: 0;
      z-index: 1;
    }

    .left-block,
    .right-block {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      align-content: center;
      z-index: 2;
    }

    .left-block {
      left: 100px;
      width: 560px;
    }

    .right-block {
      left: 760px;
      width: 540px;
    }

    .eyebrow {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow.left {
      color: var(--orange);
    }

    .eyebrow.right {
      color: var(--muted-2);
    }

    .old-price {
      position: relative;
      width: max-content;
      margin-top: 14px;
      font-family: var(--font-display);
      font-size: 96px;
      font-weight: 900;
      line-height: 0.92;
      color: var(--price-old);
    }

    .old-price::after {
      content: "";
      position: absolute;
      left: -0.02em;
      right: -0.03em;
      top: 52%;
      height: 4px;
      border-radius: 999px;
      background: var(--danger);
      transform: translateY(-50%) rotate(-2deg);
    }

    .old-sub {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 500;
      color: var(--muted);
    }

    .new-price {
      margin-top: 12px;
      font-family: var(--font-display);
      font-size: 160px;
      font-weight: 900;
      line-height: 1;
      color: var(--orange);
    }

    .new-sub {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 500;
      color: var(--white);
    }

    .divider {
      position: absolute;
      top: 80px;
      bottom: 80px;
      left: 700px;
      width: 1px;
      background: var(--divider);
      z-index: 2;
    }

    .bottom-strip {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 0 36px;
      background: var(--orange);
      color: var(--white);
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      z-index: 3;
    }

    .bottom-strip .brand {
      font-weight: 900;
    }

    .dot {
      opacity: 0.86;
    }
  </style>
</head>
<body>
  <main class="main">
    <section class="left-block">
      <div class="eyebrow left">WHILE YOUR COMPETITOR PAYS</div>
      <div class="old-price">$150</div>
      <div class="old-sub">per lead on Thumbtack</div>
    </section>

    <div class="divider"></div>

    <section class="right-block">
      <div class="eyebrow right">YOU PAY</div>
      <div class="new-price">$0</div>
      <div class="new-sub">per lead · forever</div>
    </section>
  </main>

  <footer class="bottom-strip">
    <span class="brand">GrabClientsNow</span>
    <span class="dot">·</span>
    <span>Local Facebook Groups</span>
    <span class="dot">·</span>
    <span>Reply First. Win Every Job.</span>
  </footer>
</body>
</html>
