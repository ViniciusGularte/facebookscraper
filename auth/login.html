<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../ui/ui.css" />
    <title>Login</title>

    <style>
      .authWrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: linear-gradient(180deg, #ffffff 0%, #f7fafc 100%);
      }
      .authCard {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #e3e8ef;
        border-radius: 16px;
        box-shadow: 0 16px 32px rgba(16, 24, 40, 0.1);
        overflow: hidden;
      }
      .authHead {
        padding: 16px 16px 10px;
        border-bottom: 1px solid #e3e8ef;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .authMark {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        background: radial-gradient(
          circle at 30% 30%,
          rgba(46, 166, 111, 0.25),
          rgba(46, 166, 111, 0.06) 55%,
          rgba(46, 166, 111, 0) 70%
        );
        border: 1px solid rgba(46, 166, 111, 0.18);
      }
      .authTitle {
        font-weight: 700;
        font-size: 16px;
        color: #101828;
        line-height: 1.1;
      }
      .authSub {
        margin-top: 2px;
        font-size: 12px;
        color: #667085;
      }
      .authBody {
        padding: 16px;
      }

      .topRow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      .langSel {
        height: 34px;
        border-radius: 10px;
        border: 1px solid #e3e8ef;
        padding: 0 10px;
        background: #fff;
        color: #344054;
        font-size: 12px;
      }

      .field {
        margin-bottom: 12px;
      }
      .label {
        display: block;
        font-size: 12px;
        color: #475467;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .input {
        width: 100%;
        height: 44px;
        border-radius: 12px;
        border: 1px solid #e3e8ef;
        padding: 0 12px;
        outline: none;
        background: #fff;
        color: #101828;
      }
      .input:focus {
        border-color: rgba(46, 166, 111, 0.55);
        box-shadow: 0 0 0 4px rgba(46, 166, 111, 0.12);
      }

      .btn {
        width: 100%;
        height: 44px;
        border-radius: 12px;
        border: 1px solid #2ea66f;
        background: #2ea66f;
        color: #fff;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
        transition:
          transform 0.08s ease,
          box-shadow 0.12s ease,
          background 0.12s ease,
          border-color 0.12s ease,
          opacity 0.12s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .btn:hover {
        background: #1f8a58;
        border-color: #1f8a58;
        box-shadow: 0 10px 20px rgba(16, 24, 40, 0.12);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .hintLine {
        margin-top: 12px;
        font-size: 12px;
        color: #667085;
        text-align: center;
        line-height: 1.4;
      }
      .link {
        color: #1f8a58;
        font-weight: 800;
        text-decoration: none;
      }
      .link:hover {
        text-decoration: underline;
      }

      .notice {
        margin-top: 12px;
        font-size: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid #e3e8ef;
        background: #fff;
        color: #475467;
      }
      .notice.err {
        border-color: rgba(190, 18, 60, 0.25);
        background: rgba(190, 18, 60, 0.06);
        color: #be123c;
        font-weight: 800;
      }
      .notice.ok {
        border-color: rgba(31, 138, 88, 0.25);
        background: rgba(31, 138, 88, 0.07);
        color: #1f8a58;
        font-weight: 800;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="authWrap">
      <div class="authCard">
        <div class="authHead">
          <div class="authMark" aria-hidden="true"></div>
          <div style="min-width: 0">
            <div class="authTitle" data-i18n="login.title">Entrar</div>
            <div class="authSub" data-i18n="login.subtitle">
              Acesse sua conta para ver oportunidades.
            </div>
          </div>
        </div>

        <div class="authBody">
          <div class="topRow">
            <div
              style="font-size: 12px; color: #667085"
              data-i18n="login.langLabel"
            >
              Idioma
            </div>
            <select id="lang" class="langSel" aria-label="Idioma">
              <option value="pt-BR">Português</option>
              <option value="es">Español</option>
              <option value="en">English</option>
            </select>
          </div>

          <div class="field">
            <label class="label" for="email" data-i18n="login.email"
              >Email</label
            >
            <input id="email" class="input" autocomplete="email" />
          </div>

          <div class="field">
            <label class="label" for="password" data-i18n="login.password"
              >Senha</label
            >
            <input
              id="password"
              type="password"
              class="input"
              autocomplete="current-password"
            />
          </div>

          <button
            id="loginBtn"
            class="btn"
            type="button"
            data-i18n="login.signin"
          >
            Entrar
          </button>

          <div class="hintLine">
            <span data-i18n="login.noAccount">Não tem cadastro?</span>
            <a
              class="link"
              href="https://grabclientsnow.com"
              target="_blank"
              rel="noreferrer"
              data-i18n="login.buyOnSite"
            >
              Compre / ative aqui
            </a>
          </div>

          <div id="err" class="notice err hidden"></div>
          <div id="ok" class="notice ok hidden"></div>
        </div>
      </div>
    </div>

    <script type="module" src="login.mjs"></script>
  </body>
</html>
